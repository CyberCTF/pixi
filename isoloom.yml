# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Pixi (by Nicole Becher, OWASP DevSlop) as an Isoloom spec: the Node.js photo-sharing app,
# vendored unchanged in app/, built by its own Dockerfile (app/app/), and the seeded MongoDB
# datastore image upstream's docker-compose.yaml runs. `isoloom generate`, then `isoloom up docker`.
version: 1
name: pixi

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.23.0/24, internet: false}

machines:
  pixidb:
    networks: {lab: 20}
    resources: {cpus: 1, memory_mb: 512}
    ports:
      mongodb:
        port: 27017
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      image: deadrobots/pixi:datastore@sha256:e003b0322679e206ead17ba5f0fe4f34d00f0c410dac561e1af642f4ca63f551

  app:
    networks: {lab: 10}
    depends_on: [pixidb]
    resources: {cpus: 1, memory_mb: 512}
    ports:
      web:
        port: 8000
        protocol: http
        publish: true
      api:
        port: 8090
        protocol: http
        publish: true
    app:
      build: app/app
checks:
  - name: the web application answers
    http: http://app:8000/login
    wait: 180
  - name: the API answers
    http: http://app:8090/
  - name: a new user registers and logs in through the API
    script: checks/api-register-login.sh

message: |
  Pixi answers at {{ machines.app.ports.web.url }} and its API at
  {{ machines.app.ports.api.url }}. Register, log in, then look at the
  API: the web pages, the token handling and the admin area all leak more than they should.
