            - -c
            - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8000 && /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8090
          periodSeconds: 5
          failureThreshold: 60
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: isoloom-probe
        emptyDir: {}
