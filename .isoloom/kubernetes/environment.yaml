apiVersion: v1
kind: Namespace
metadata:
  name: isoloom-pixi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pixidb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: pixidb
  template:
    metadata:
      labels:
        isoloom.com/machine: pixidb
        net.isoloom.com/lab: member
    spec:
      hostname: pixidb
      initContainers:
      - name: isoloom-probe
        image: busybox:1.37.0-musl
        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      containers:
      - name: pixidb
        image: deadrobots/pixi:datastore@sha256:e003b0322679e206ead17ba5f0fe4f34d00f0c410dac561e1af642f4ca63f551
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 27017
        readinessProbe:
          exec:
            command:
            - /.isoloom-probe/busybox
            - sh
            - -c
            - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 27017
          periodSeconds: 5
          failureThreshold: 60
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: isoloom-probe
        emptyDir: {}
---
