# Generated by isoloom from isoloom.yml. Don't edit: change isoloom.yml and run
# `isoloom generate`. `isoloom check` fails when this file is out of date.
# Start:  docker compose -f .isoloom/docker/compose.yml up -d --wait
# Checks: isoloom test docker (or: docker compose -f .isoloom/docker/compose.yml --profile check run --rm isoloom-check, and isoloom-check-<machine>)
# Stop:   docker compose -f .isoloom/docker/compose.yml down -v

name: pixi
services:
  pixidb:
    image: deadrobots/pixi:datastore@sha256:e003b0322679e206ead17ba5f0fe4f34d00f0c410dac561e1af642f4ca63f551
    platform: linux/amd64
    hostname: pixidb
    networks:
      lab:
        ipv4_address: 10.60.23.20
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 27017
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.mongodb: tcp:27017
    restart: unless-stopped
  pixidb-routes:
    image: alpine:3.20
    network_mode: service:pixidb
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      pixidb:
        condition: service_started
    restart: unless-stopped
  app:
    build:
      context: ../../app/app
    image: isoloom/pixi-app
    platform: linux/amd64
    hostname: app
    networks:
      lab:
        ipv4_address: 10.60.23.10
    ports:
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+8000}:8000
    - ${ISOLOOM_PUBLISH_ADDRESS:-127.0.0.1}:${ISOLOOM_PUBLISH_FIXED:+8090}:8090
    healthcheck:
      test:
      - CMD
      - /.isoloom-probe/busybox
      - sh
      - -c
      - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8000 && /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 8090
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
    - isoloom-probe-amd64:/.isoloom-probe:ro
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
      pixidb:
        condition: service_healthy
      pixidb-routes:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    labels:
      isoloom.service.web: http:8000
      isoloom.service.api: http:8090
    restart: unless-stopped
  app-routes:
    image: alpine:3.20
    network_mode: service:app
    cap_add:
    - NET_ADMIN
    entrypoint:
    - /bin/sh
    - -c
    - (ip route del default 2>/dev/null || true) && while ip -o -4 addr show | grep -qv ' lo '; do sleep 2; done; exit 1
    healthcheck:
      test:
      - CMD-SHELL
      - '! ip route | grep -q ''^default'''
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped
  isoloom-check:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - -c
    - ip route del default 2>/dev/null; exec sh /isoloom/run.sh
    volumes:
    - ./checks/networks.sh:/isoloom/run.sh:ro
    - ../..:/isoloom/project:ro
    networks:
      lab: null
    user: '0'
    cap_add:
    - NET_ADMIN
    depends_on:
      pixidb:
        condition: service_healthy
      pixidb-routes:
        condition: service_healthy
      app:
        condition: service_healthy
      app-routes:
        condition: service_healthy
  isoloom-check-pixidb:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/pixidb.sh:/isoloom/run.sh:ro
    network_mode: service:pixidb
    depends_on:
      pixidb:
        condition: service_healthy
      pixidb-routes:
        condition: service_healthy
      app:
        condition: service_healthy
      app-routes:
        condition: service_healthy
  isoloom-check-app:
    image: curlimages/curl:8.11.1
    profiles:
    - check
    entrypoint:
    - /bin/sh
    - /isoloom/run.sh
    volumes:
    - ./checks/app.sh:/isoloom/run.sh:ro
    network_mode: service:app
    depends_on:
      pixidb:
        condition: service_healthy
      pixidb-routes:
        condition: service_healthy
      app:
        condition: service_healthy
      app-routes:
        condition: service_healthy
  isoloom-probe-amd64:
    image: busybox:1.37.0-musl
    platform: linux/amd64
    entrypoint:
    - /bin/cp
    - /bin/busybox
    - /probe/busybox
    volumes:
    - isoloom-probe-amd64:/probe
    network_mode: none
    restart: no
networks:
  lab:
    ipam:
      config:
      - subnet: 10.60.23.0/24
        gateway: 10.60.23.1
volumes:
  isoloom-probe-amd64: {}
